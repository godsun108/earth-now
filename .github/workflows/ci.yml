name: Earth Now CI
on:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "dynamic/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate archived observation contract
        run: python -m unittest discover -s tests -v
      - name: Syntax-check ingest
        run: python -m py_compile dynamic/ingest.py
      - name: Enforce release fingerprint
        run: |
          python -c 'import hashlib,re,pathlib; s=pathlib.Path("index.html").read_text(); h=hashlib.sha256(pathlib.Path("app.js").read_bytes()).hexdigest()[:12]; assert re.search(r"app\.js\?v="+h+r"[\"\x27]",s), "app.js fingerprint does not match asset"'
          ! grep -q 'app.js?v=20260928-4' index.html
