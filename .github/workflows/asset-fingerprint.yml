name: Earth Asset Fingerprint Guard
on:
  push:
    paths:
      - "app.js"
      - "styles.css"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earth-asset-fingerprint
  cancel-in-progress: true
jobs:
  fingerprint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fingerprint mutable client assets
        run: |
          python - <<'PY'
          import hashlib,re
          p="index.html"; s=open(p).read()
          for asset in ("app.js","styles.css"):
              h=hashlib.sha256(open(asset,"rb").read()).hexdigest()[:12]
              s=re.sub(re.escape(asset)+r'\?v=[^"\']+',asset+"?v="+h,s)
          open(p,"w").write(s)
          PY
      - name: Commit fingerprint only when needed
        run: |
          git config user.name release-integrity-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --quiet index.html && exit 0
          git add index.html
          git commit -m "Stamp Earth client asset fingerprints"
          git pull --rebase origin main
          git push
