name: Earth Now Dynamic Ingest
on:
  workflow_dispatch:
  push:
    paths:
      - "dynamic/ingest.py"
      - ".github/workflows/earth-now-dynamic.yml"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: earth-now-dynamic
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ingest public observations
        run: python dynamic/ingest.py
      - name: Commit snapshot
        run: |
          git config user.name earth-now-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dynamic/latest.json dynamic/archive
          git diff --cached --quiet && exit 0
          git commit -m "Archive Earth observation snapshot"
          git push
